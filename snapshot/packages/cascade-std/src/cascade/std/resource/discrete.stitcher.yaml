"discrete_allocator": |-
  Handles allocation requests for discrete resources.
  Inputs: ledger_in, req_in
  Outputs: ledger_out, gnt_out (if granted), req_out (if rejected)

"discrete_reclaimer": |-
  Handles release (return) of discrete resources.
  Inputs: ledger_in, rel_in
  Outputs: ledger_out
