[package]
name = "cascade-vm-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "cascade_vm_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20.0", features = ["tokio-runtime"] }
tokio = { version = "1.0", features = ["full"] }