"EventDrivenRunner.from_assembly": |-
  Creates an EventDrivenRunner from a compiled Assembly.
  This method automatically runs the Linker to verify integrity and build the function map.
"EventDrivenRunner.inject_input": |-
  Helper to inject data into a node.
"EventDrivenRunner.run_until_complete": |-
  Convenience method to wait for a specific task to complete (End event).
"EventDrivenRunner.start_loop": |-
  Starts the reactor loop in the background.
"EventDrivenRunner.wait_for_event": |-
  Waits until an event matching the predicate arrives.
  Captures all intermediate events.
