Renderer: 'Protocol defining the interface for all message renderers.

  A renderer is responsible for taking a final, formatted message string

  and presenting it to the user (e.g., printing to console, logging).'
render: "The core rendering method.\n\nArgs:\n    msg_id: The semantic ID of the message\
