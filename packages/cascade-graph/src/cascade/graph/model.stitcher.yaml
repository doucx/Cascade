"Edge": |-
  Represents a directed dependency from source node to target node.
"EdgeType": |-
  Defines the semantic type of a dependency edge.
"Graph": |-
  A container for nodes and edges representing the workflow topology.
"MapNode": |-
  Represents a mapped task execution.
"Node": |-
  Base class for all nodes in the Cascade graph.
"Node.callable_obj": |-
  Polymorphic accessor for the executable object.
"ParamNode": |-
  Represents an external parameter injection.
"TaskNode": |-
  Represents a standard executable task.
