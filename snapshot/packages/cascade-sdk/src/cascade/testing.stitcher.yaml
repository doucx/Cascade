ControllerTestApp: 'A lightweight simulator for the cs-controller CLI tool.

  Useful for testing how a workflow responds to control plane events (pause, resume).'
MockConnector: 'A mock connector for testing that simulates MQTT behavior,

  including retained messages and topic matching.'
MockExecutor: 'A generic mock for the Executor protocol that can simulate various

  behaviors like delays or returning specific values.'
MockSolver: 'A test double for the Solver protocol that returns a pre-programmed plan,

  bypassing any real resolution logic.'
SpyExecutor: A test double for the Executor protocol that logs all calls to `execute`.
SpySolver: 'A test double for the Solver protocol that spies on calls to `resolve`

  while delegating to a real underlying solver.'
SpySubscriber: A test utility to collect events from an EventBus.
_trigger_message: Helper to simulate receiving a message, used by tests and publish().
events_of_type: Returns a list of all events of a specific type.
override_resource: "A context manager to temporarily override a resource for testing\
  \ purposes.\n\nUsage:\n    engine = Engine()\n    engine.register(production_db)\n\
  \n    with override_resource(engine, \"production_db\", mock_db):\n        engine.run(my_task)\
  \ # my_task will receive mock_db"
publish: Simulates publishing a message, triggering subscribers and handling retention.
seed_retained_message: Helper to pre-seed a retained message on the 'broker' for test
  setup.
