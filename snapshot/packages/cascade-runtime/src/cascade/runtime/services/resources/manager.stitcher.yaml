ResourceManager: 'Manages system resources and ensures task concurrency respects resource
  constraints.

  Uses asyncio.Condition to coordinate resource acquisition.'
_can_acquire: Internal check to see if resources are currently available.
_validate_feasibility: Checks if the requirement exceeds total system capacity.
acquire: 'Atomically acquires the requested resources.

  Waits until all resources are available.'
can_acquire: Checks if the requested resources are currently available without blocking.
release: Releases the resources and notifies waiting tasks.
set_capacity: Updates system capacity configuration.
update_resource: Dynamically updates or creates a single resource's capacity.
