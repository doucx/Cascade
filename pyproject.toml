[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascade-monorepo"
version = "0.1.0"
description = "A modern, declarative automation library for Python."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
dependencies = [
    "cascade-spec",
    "cascade-runtime",
    "cascade-sdk",
    "cascade-library",
    "cascade-vm",
    "cascade-compiler",
]

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
cascade-spec = { workspace = true }
cascade-runtime = { workspace = true }
cascade-sdk = { workspace = true }
cascade-reflection = { workspace = true }
cascade-library = { workspace = true }
cascade-application = { workspace = true }
cascade-provider-ipfs = { workspace = true }
cascade-cli-controller = { workspace = true }
cascade-cli-observer = { workspace = true }
cascade-connector-mqtt = { workspace = true }
cascade-connector-local = { workspace = true }
cascade-common = { workspace = true }
cascade-test-utils = { workspace = true }
cascade-vm = { workspace = true }
cascade-compiler = { workspace = true }
cascade-std = { workspace = true }
cascade = { workspace = true }
cascade-vm-rs = { workspace = true }

[tool.hatch.workspaces]
packages = [
    "packages/cascade-spec",
    "packages/cascade-runtime",
    "packages/cascade-sdk",
    "packages/cascade-provider-ipfs",
    "packages/cascade-library",
    "packages/cascade-connector-local",
    "packages/cascade-vm",
    "packages/cascade-compiler",
    "packages/cascade-std",
    "packages/cascade-vm-rs",
    "packages/cascade-reflection",
    "packages/cascade-test-utils",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_monorepo"]

[tool.pytest.ini_options]
addopts = "-ra --cov=cascade --cov-report=term-missing"
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-timeout",
  "pytest-aiohttp",
  "pytest-mock",
  "pytest-asyncio",
  "moto[s3]",
  "typer",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  # Consolidated testing dependencies
  "redis",
  "aiobotocore",
  "sqlalchemy",
  "PyYAML",
  "jinja2",
  "aiohttp",
  "python-constraint",
  "flask_cors",
  # Local workspace packages needed for testing
  "cascade-application",
  "cascade-provider-ipfs",
  "cascade-cli-controller",
  "cascade-cli-observer",
  "cascade-connector-mqtt",
  "cascade-connector-local",
  "cascade-test-utils",
  "cascade-vm",
  "cascade-vm-rs",
  "cascade-compiler",
  "cascade-std",
  # "cascade", # The python sdk
  "ruff",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.stitcher]
scan_paths = ["packages"]

[tool.pyright]
include = ["packages"]
exclude = ["**/node_modules", "**/__pycache__", "**/tests"]

reportMissingImports = true
reportMissingTypeStubs = false

executionEnvironments = [
  { root = "packages", extraPaths = [ "packages/cascade-application/src", "packages/cascade-cli-controller/src", "packages/cascade-cli-observer/src", "packages/cascade-common/src", "packages/cascade-connector-local/src", "packages/cascade-connector-mqtt/src", "packages/cascade-runtime/src", "packages/cascade-library/src", "packages/cascade-provider-ipfs/src", "packages/cascade-sdk/src", "packages/cascade-spec/src", "packages/cascade-vm/src", "packages/cascade-compiler/src", "packages/cascade-std/src" ] }
]
