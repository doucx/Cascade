MqttConnector: 'Implements the Connector protocol for MQTT.


  This connector enables Cascade to publish telemetry data to an MQTT broker

  and subscribe to control commands.'
_message_loop: Background task to process incoming MQTT messages.
_topic_matches: 'Checks if a concrete topic matches a subscription pattern (supporting
  + and #).'
connect: Establishes a connection to the MQTT Broker.
disconnect: Disconnects from the MQTT Broker and cleans up resources.
publish: Publishes a message in a non-blocking, fire-and-forget manner.
subscribe: Subscribes to a topic to receive messages.
