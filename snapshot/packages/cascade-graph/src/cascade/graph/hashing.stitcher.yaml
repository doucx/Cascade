BlueprintHasher: 'Computes a hash for a Graph''s topology, ignoring literal input
  values.

  This hash is used to cache compiled execution plans.'
HashingService: 'Service responsible for computing a stable Merkle hash for a node
  instance.

  This is the `Instance Hash`, which uniquely identifies a specific, fully-parameterized

  node instance. It is used for results caching and node de-duplication within a graph.'
_build_hash_components: Recursively builds hash components, always including literal
  values.
_get_merkle_hash: Computes a stable hash from a list of string components.
_get_node_components: Gets the hash components for a single node, normalizing literals.
compute_hash: Computes the blueprint hash for the entire graph.
compute_node_instance_hash: "Computes the unique structural ID for a Node instance.\n\
  \nFormula:\n  Hash(\n     Definition.Fingerprint['canonical_code_structure_hash']\n\
  \     | Instance.Policies\n     | Instance.Bindings (merged args/kwargs)\n     |\
  \ Instance.PuritySalt (if impure)\n  )"
