PhysicsExecutor: 'Manages a thread pool to execute blocking or CPU-bound functions

  off the main asyncio event loop.'
submit: "Submits a function to be run in a background thread.\n\nArgs:\n    func:\
  \ The function to execute.\n    args: A tuple of positional arguments for the function.\n\
  \nReturns:\n    The result of the function call.\n\nRaises:\n    Exception: Any\
  \ exception raised by the target function."
