ResourceContainer: Manages the lifecycle, registration, and dependency injection of
  resources.
_scan_item: Recursively scans an item for Inject objects.
get_provider: Retrieves the raw provider function for a resource.
override: A context manager to safely override a provider and guarantee restoration.
override_provider: Overrides a resource provider (useful for testing).
register: Registers a resource definition.
scan: Scans the graph to identify all resources required by the nodes.
setup: Initializes required resources that are not yet active.
