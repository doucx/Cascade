"Reactor": |-
  The heart of the physics engine.
  Scans the topology for excited states and fires transitions.
"Reactor._fire": |-
  Internal method to execute a node transition.
  1. Atomically consumes tokens from all input slots.
  2. Submits the actual payload to an Executor.
  3. Puts the resulting token into the output slots.
"Reactor.add_sink": |-
  Register a callback to receive tokens emitted by a specific port.
"Reactor.prime": |-
  Injects initial potential energy (tokens) into the system
  based on PhysicsDataNode.initial_tokens.
"Reactor.step": |-
  Scans the graph for excited nodes and schedules them for execution.
  Returns the number of tasks scheduled (fired) in this step.
  This method is NON-BLOCKING regarding task execution.
