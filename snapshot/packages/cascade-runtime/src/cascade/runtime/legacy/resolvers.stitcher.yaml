ArgumentResolver: 'Resolves arguments by combining:

  1. Structural bindings (Literal values stored in Node)

  2. Upstream dependencies (Edges)

  3. Resource injections'
ConstraintResolver: Responsible for resolving dynamic resource constraints for a node.
_get_node_result: Helper to get a node's result, with skip penetration logic.
_resolve_data_edges: 'Shared helper to resolve all incoming DATA edges for a node,

  respecting the priority of input_overrides from TCO Jumps.'
