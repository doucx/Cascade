PhysicsDataNode: 'Represents a storage location (Place) in the Petri net.

  It holds Tokens.'
PhysicsFuncNode: 'Represents a transformation unit (Transition) in the Petri net.

  It consumes Tokens from inputs and produces Tokens to outputs.'
PhysicsNode: Base class for all static entities in the bipartite graph.
Token: The fundamental unit of energy and information flow in the physics field.
capacity: Maximum number of tokens this node can hold simultaneously.
id: 'The unique physical ID for this node instance within a compiled graph.

  Naming Convention: Path-like, e.g., ''node_a.bleach'', ''canonical.resource.gpu''.

  Generated by the compiler to ensure uniqueness and aid in debugging.'
initial_payload: The payload to use for pre-filled tokens.
initial_tokens: Number of tokens to pre-fill at reactor startup (Potential Energy).
input_ports: Map of port_name -> PortDef.
name: Human-readable name for debugging and visualization.
output_ports: Map of port_name -> PortDef.
payload: The actual data being transferred (Business Value).
trace: 'Metadata accumulator for observability and context propagation.

  Contains timestamp, source_id, retry_counts, etc.'
