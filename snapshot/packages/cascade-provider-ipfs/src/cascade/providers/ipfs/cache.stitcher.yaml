IpfsCacheBackend: "A cache backend that stores results in IPFS via its HTTP RPC API.\n\
  \nIt uses a secondary 'metadata_backend' (like Redis or In-Memory) to map\napplication\
  \ cache keys to IPFS Content Identifiers (CIDs).\n\nStructure:\n   App Key -> Metadata\
  \ Backend -> CID -> IPFS -> Serialized Data"
__init__: "Args:\n    metadata_backend: A fast K-V backend to store Key->CID mappings.\n\
  \    ipfs_api_url: The base URL of the IPFS RPC API (default: local Kubo node)."
get: Retrieves a CID from metadata and then fetches content from IPFS.
set: Serializes value, adds it to IPFS to get a CID, then stores key->CID mapping.
