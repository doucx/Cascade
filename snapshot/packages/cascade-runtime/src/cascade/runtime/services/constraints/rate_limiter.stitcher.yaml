RateLimiter: 'Implements a Token Bucket algorithm for rate limiting.

  Manages multiple independent buckets identified by a key (scope).'
try_acquire: "Attempts to acquire tokens from the bucket.\n\nReturns:\n    0.0 if\
  \ successful.\n    >0.0 if failed, representing the seconds to wait until enough\
  \ tokens are available."
update_bucket: "Updates or creates a bucket configuration.\n\nArgs:\n    key: Unique\
  \ identifier for the bucket.\n    rate: Tokens per second.\n    capacity: Max tokens.\
  \ Defaults to rate (i.e., 1 second worth of tokens)."
