NodeRegistry: 'A session-level registry that ensures any structurally identical node

  is represented by a single, unique object in memory (interning).'
get: Gets a node by its structural hash key.
get_or_create: "Gets a node from the registry or creates it using the factory if not\
  \ found.\n\nReturns:\n    A tuple of (Node, bool) where the boolean is True if the\
  \ node was newly created."
